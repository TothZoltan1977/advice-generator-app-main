<!DOCTYPE html>
<html lang="en">
    <head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  
  <link rel="stylesheet" href="style.css">
  
   <title>Frontend Mentor | Advice generator app</title>

   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">

  </head>

  <body>

    <main>

      <div class="card">
      <p class="advice_number">Advice #117</p>
      <p class="advice_text">
      "It is easy to sit up and take notice, what's difficult is getting up and take action."
      </p>
      <img class="desktop_img" src="./images/pattern-divider-desktop.svg" alt="">

      <img class="mobile_img" src="./images/pattern-divider-mobile.svg" alt="">


      <button type="button" class="card_button" aria-label="Generate new advice">
      <img src="./images/icon-dice.svg" alt="">
      </button>
      </div>

    </main>

  </body>
</html>
